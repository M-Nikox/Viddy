name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Package portable release bundles
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          DIR_NAME="viddy-${TAG}"
          
          mkdir -p "${DIR_NAME}"
          cp -r dist server.ts package.json package-lock.json tsconfig.json vite.config.ts run_portable.bat run_portable.sh README.md LICENSE .env.example public src "${DIR_NAME}/"
          mkdir -p "${DIR_NAME}/media_storage"
          touch "${DIR_NAME}/media_storage/.gitkeep"
          
          zip -r "${DIR_NAME}.zip" "${DIR_NAME}"
          tar -czf "${DIR_NAME}.tar.gz" "${DIR_NAME}"

      - name: Attach Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            viddy-*.zip
            viddy-*.tar.gz
